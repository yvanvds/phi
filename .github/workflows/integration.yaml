name: Integration tests

# Why this is a separate workflow, and why it is *not* on every develop PR
# (issue #391, cost rationale from issue #12, post-merge model from issue #417):
#
# `integration_test/` is format-checked and analyzed by ci.yaml, but nothing
# there ever executes it — `flutter test` only walks `test/`. The suite also
# needs a real Flutter device (`-d windows`), so it cannot be bolted onto the
# ubuntu-latest analyze job; it needs windows-latest, which GitHub bills at 2x.
#
# The trade-off chosen (#417): the sweep runs on every *push to develop* —
# i.e. right after each merge — instead of blocking the PR that caused it.
# Feature PRs stay at ci.yaml's cheap gate; the full sweep happens minutes
# later in the background, and because merges land sequentially, a red sweep
# indicts exactly one merge. Nobody consumes develop yet (#417), so a red
# develop for an hour is information, not an outage. Nothing can reach `main`
# without a green pre-merge sweep on the release PR.
#
# On-demand pre-merge coverage still exists: label a develop PR
# `ci:integration` (worth it when the PR rewires this plumbing itself), or
# dispatch the workflow manually. The nightly cron stays for one narrow job:
# catching breaks where the world moved and the code didn't (runner image,
# toolchain) — a push-triggered sweep never sees those.
#
# Two mechanics worth knowing:
#   * One `flutter test integration_test` run does NOT reliably drive the whole
#     folder on Windows, so tool/run_integration_tests.ps1 runs each file as its
#     own `flutter test` invocation and aggregates the results.
#   * No `libyse.dll` is needed: every file in the suite injects
#     `FakeYseGateway`, so the app under test never opens the native engine.
#     That is what keeps this job a plain runner with no release download.
#
# The supply-chain rules this file follows — every `uses:` pinned to a commit
# SHA, phi's resolve run with `--enforce-lockfile` — are stated once in the
# header of ci.yaml (issue #396). Read them there before bumping anything here.

on:
  schedule:
    # 03:17 UTC nightly. Scheduled runs always use the default branch (develop).
    - cron: '17 3 * * *'
  pull_request:
    # Every PR into main runs it. A PR into develop only runs it when labelled
    # `ci:integration` — the opt-in for work that changes this plumbing or
    # touches an end-to-end path you don't want to wait a night to check.
    # `labeled` is in the list so adding the label starts a run immediately.
    branches: [main, develop]
    types: [opened, synchronize, reopened, labeled]
  push:
    # develop: the post-merge sweep (#417) — every merge gets the full suite
    # without ever blocking a PR. main: belt-and-braces on release.
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      filter:
        description: 'Wildcard over file names, e.g. patcher_* (default: all)'
        required: false
        default: '*'

concurrency:
  # PRs: a superseded commit cancels its older run. Pushes: every merge's
  # sweep gets its own group (keyed by sha) and runs to completion —
  # cancelling one would erase the only run that can indict its merge (#417).
  group: integration-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  integration:
    name: integration ${{ matrix.shard }}/4
    # Skip the inherited nightly cron on forks, and skip develop PRs that did
    # not ask for the sweep. A skipped job costs nothing.
    if: >-
      ${{ (github.event_name != 'schedule' || github.repository == 'yvanvds/phi')
          && (github.event_name != 'pull_request'
              || github.base_ref == 'main'
              || contains(github.event.pull_request.labels.*.name, 'ci:integration')) }}
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      # Every shard reports its own failures; one broken surface should not
      # hide the state of the other three.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout phi
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: phi

      - name: Checkout dart-yse (path dep sibling)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: yvanvds/dart-yse
          path: dart-yse
          ref: main

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # This pin, the `environment:` floor in `pubspec.yaml`
          # (flutter >=3.44.0 / sdk ^3.12.0), and the committed `pubspec.lock`
          # are one contract: the lock records the same floors, so
          # --enforce-lockfile below can only be satisfied by an SDK that
          # meets them. Bump the three together, never one alone (#420).
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      # Unenforced on purpose: dart-yse gitignores its `pubspec.lock`, so there
      # is nothing to enforce against. Give that repo a committed lockfile and
      # this becomes `dart pub get --enforce-lockfile` too.
      - name: Resolve dart-yse deps
        working-directory: dart-yse
        run: dart pub get

      # --enforce-lockfile makes the committed `pubspec.lock` the contract:
      # pub resolves to exactly those versions and exits 65 if `pubspec.yaml`
      # asks for anything the lockfile cannot satisfy. A PR that edits
      # `pubspec.yaml` without regenerating the lock fails right here.
      - name: Resolve phi deps
        working-directory: phi
        run: flutter pub get --enforce-lockfile

      # windows/runner/main.cpp opens a 1280x720 window at origin (10,10), but
      # the GitHub image boots a 1024x768 virtual display, so the window is
      # clamped and the app lays out at a size no developer ever sees — taps
      # then land on the neighbouring widget. Give it a desktop-sized display.
      - name: Widen the virtual display
        shell: pwsh
        run: |
          function Show-Resolution($when) {
            $mode = Get-CimInstance Win32_VideoController |
              Select-Object -First 1 CurrentHorizontalResolution, CurrentVerticalResolution
            Write-Host "$when : $($mode.CurrentHorizontalResolution)x$($mode.CurrentVerticalResolution)"
          }
          Show-Resolution 'before'
          if (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue) {
            Set-DisplayResolution -Width 1920 -Height 1080 -Force
            Show-Resolution 'after'
          }
          else {
            Write-Host 'Set-DisplayResolution is not available on this image.'
          }

      - name: Run integration suite (one flutter test run per file)
        shell: pwsh
        working-directory: phi
        # The dispatch input travels via env rather than string interpolation,
        # so a filter value can never be spliced into the command line.
        env:
          FILTER: ${{ github.event.inputs.filter || '*' }}
        run: >
          ./tool/run_integration_tests.ps1
          -Shard ${{ matrix.shard }}
          -Of 4
          -Filter $env:FILTER
