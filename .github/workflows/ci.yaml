name: CI

# Supply-chain rules for every workflow in this folder (issue #396):
#
#   * Every `uses:` is pinned to a full 40-char commit SHA, with the human
#     version in a trailing comment. A tag like `@v4` is a moving pointer the
#     upstream owner can repoint at any commit; these jobs hold SONAR_TOKEN and
#     a GITHUB_TOKEN, so an unreviewed retag would run with our secrets. The
#     comment is what you read; the SHA is what runs. First-party `actions/*`
#     are pinned on the same terms — being first-party changes who would have
#     to be compromised, not what a compromise could do.
#     To bump one: `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` (deref
#     annotated tags via `git/tags/<sha>`), then update SHA *and* comment
#     together.
#   * phi's own resolve runs `flutter pub get --enforce-lockfile`, so a PR whose
#     `pubspec.yaml` moved without a regenerated `pubspec.lock` fails here
#     (exit 65, "Unable to satisfy `pubspec.yaml` using `pubspec.lock`")
#     instead of silently building against a set of versions nobody reviewed.
#     phi commits `pubspec.lock`; dart-yse gitignores its own, so the sibling
#     `dart pub get` below stays unenforced until that repo commits one.
#   * A lockfile only means anything against a fixed SDK: `pubspec.lock` carries
#     its own `sdks:` block, and pub refuses to honour a lock its SDK cannot
#     satisfy. So `flutter-version:` here and that block are a single contract —
#     bump them in the same commit, never one without the other. (Before #396
#     they had already drifted apart, and plain `pub get` hid it by silently
#     resolving a different graph than the lockfile describes.)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  # Manual trigger: lets the main-only Windows build be exercised on demand
  # (e.g. to verify it from develop before the first develop -> main release).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-scan:
    name: analyze + test + SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout phi
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: phi
          fetch-depth: 0

      - name: Checkout dart-yse (path dep sibling)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: yvanvds/dart-yse
          path: dart-yse
          ref: main

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # This pin, the `environment:` floor in `pubspec.yaml`
          # (flutter >=3.44.0 / sdk ^3.12.0), and the committed `pubspec.lock`
          # are one contract: the lock records the same floors, so
          # --enforce-lockfile below can only be satisfied by an SDK that
          # meets them. Bump the three together, never one alone (#420).
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      # Unenforced on purpose: dart-yse gitignores its `pubspec.lock`, so there
      # is nothing to enforce against. Give that repo a committed lockfile and
      # this becomes `dart pub get --enforce-lockfile` too.
      - name: Resolve dart-yse deps
        working-directory: dart-yse
        run: dart pub get

      # --enforce-lockfile makes the committed `pubspec.lock` the contract:
      # pub resolves to exactly those versions and exits 65 if `pubspec.yaml`
      # asks for anything the lockfile cannot satisfy. A PR that edits
      # `pubspec.yaml` without regenerating the lock fails right here.
      - name: Resolve phi deps
        working-directory: phi
        run: flutter pub get --enforce-lockfile

      - name: Format check
        working-directory: phi
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        working-directory: phi
        run: flutter analyze

      - name: Test (with coverage)
        working-directory: phi
        run: flutter test --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: phi/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

      - name: SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@383f7e52eae3ab0510c3cb0e7d9d150bbaeab838 # v3.1.0
        with:
          projectBaseDir: phi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Expensive Windows build: produces a runnable .exe bundle carrying libyse.dll.
  # Gated to main (release PRs from develop + pushes to main) and manual dispatch;
  # routine feature PRs to develop skip it to keep everyday CI cheap (issue #12).
  #
  # Sibling tier: `integration_test/` is only format-checked and analyzed here —
  # executing it needs a Flutter device, so it lives in integration.yaml on the
  # same windows/cost tier (nightly on develop + release PRs into main, issue
  # #391). Read that file's header for the trade-off.
  build-windows:
    name: build windows (.exe + bundle libyse.dll)
    needs: analyze-test-scan
    if: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    env:
      # Prebuilt engine binaries come from the yse-soundengine GitHub releases.
      # Bump this to track the engine version that dart-yse currently wraps.
      YSE_ENGINE_VERSION: v2.2.0
    steps:
      - name: Checkout phi
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: phi

      - name: Checkout dart-yse (path dep sibling)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: yvanvds/dart-yse
          path: dart-yse
          ref: main

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # This pin, the `environment:` floor in `pubspec.yaml`
          # (flutter >=3.44.0 / sdk ^3.12.0), and the committed `pubspec.lock`
          # are one contract: the lock records the same floors, so
          # --enforce-lockfile below can only be satisfied by an SDK that
          # meets them. Bump the three together, never one alone (#420).
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      # Unenforced on purpose: dart-yse gitignores its `pubspec.lock`, so there
      # is nothing to enforce against. Give that repo a committed lockfile and
      # this becomes `dart pub get --enforce-lockfile` too.
      - name: Resolve dart-yse deps
        working-directory: dart-yse
        run: dart pub get

      # --enforce-lockfile makes the committed `pubspec.lock` the contract:
      # pub resolves to exactly those versions and exits 65 if `pubspec.yaml`
      # asks for anything the lockfile cannot satisfy. A PR that edits
      # `pubspec.yaml` without regenerating the lock fails right here.
      - name: Resolve phi deps
        working-directory: phi
        run: flutter pub get --enforce-lockfile

      - name: Build Windows app (release)
        working-directory: phi
        run: flutter build windows --release

      - name: Fetch prebuilt libyse.dll from the yse-soundengine release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $dest = "$env:RUNNER_TEMP\yse"
          New-Item -ItemType Directory -Force $dest | Out-Null
          gh release download $env:YSE_ENGINE_VERSION -R yvanvds/yse-soundengine -p "*windows-x64.zip" -D $dest
          $zip = Get-ChildItem "$dest\*.zip" | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath "$dest\extracted" -Force

      - name: Bundle native libraries next to phi.exe and verify
        shell: pwsh
        working-directory: phi
        run: |
          $bundle = "build\windows\x64\runner\Release"
          # The engine's bin/ ships libyse.dll plus every runtime dependency
          # (libc++, portaudio, sndfile, rtmidi, codecs). Copy them all so the
          # artifact actually runs. phi's windows CMake already drops the stray
          # flutter_angle libc++.dll, so libyse's own libc++ wins the loader.
          Get-ChildItem -Recurse -Filter *.dll "$env:RUNNER_TEMP\yse\extracted" |
            Copy-Item -Destination $bundle -Force
          if (-not (Test-Path "$bundle\libyse.dll")) {
            Write-Error "libyse.dll was not bundled into $bundle"
            exit 1
          }
          Write-Host "Bundled DLLs next to phi.exe:"
          Get-ChildItem "$bundle\*.dll" | Select-Object -ExpandProperty Name

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phi-windows-x64
          path: phi/build/windows/x64/runner/Release
          if-no-files-found: error
          retention-days: 7
