name: phi
description: "Phi — flexible workstation for live electronic music performance"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.1
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  yse:
    path: ../dart-yse
  google_fonts: ^6.2.1
  vector_math: ^2.1.4
  # Cross-platform path joining for the `.phi` project folder (#121):
  # RealProjectStore maps registry addresses to on-disk paths and back.
  path: ^1.9.0
  # Pinned to our fork (yvanvds/macbear_3d) at the remount-safety fix
  # (phi#19 / fork#2). Upstream 0.9.x tears down the process-wide
  # `M3AppEngine` singleton when an `M3View` unmounts but never resets its
  # init flag, so remounting the Scene surface crashes. The fork adds
  # `M3AppEngine.unmount()`/`remount()` so `M3View` can leave and re-enter
  # the tree safely. Ref-pinned to the merge commit for a reproducible
  # resolve; move back to a published version once the fork tags one.
  macbear_3d:
    git:
      url: https://github.com/yvanvds/macbear_3d.git
      ref: dddb55100978414b798b1a3c671a641dcdba793b
  re_editor: ^0.9.0
  re_highlight: ^0.0.3
  # SMF import/export (#30): drag a `.mid` onto the MIDI surface
  # (desktop_drop) and open/save native file dialogs (file_selector, a
  # first-party Flutter plugin). The byte↔clip codec is pure Dart in
  # lib/domain/midi/smf/; these packages only own the file-IO shell.
  desktop_drop: ^0.7.1
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Deterministic control of Timer.periodic in the MIDI player tests (#29).
  fake_async: ^1.3.1
  # Ambient clock the MIDI transport fake integrates beats from, so its
  # engine-clock model advances with `fakeAsync` time and wall time alike (#103).
  clock: ^1.1.1

dependency_overrides:
  # macbear_3d 0.9.2 pins `image: ^4.9.1`, whose only match (4.9.1) depends on
  # `xml ^7.0.1` and so requires Dart >= 3.11 (Flutter 3.44+) — above this
  # project's Flutter 3.38 floor, which breaks `pub get` on CI. `image` 4.8.0 is
  # the last release on the Dart-3.10-compatible `xml ^6.x`, and macbear only
  # uses `image` for texture decoding (which Phi's Scene doesn't exercise — it
  # draws solid-colour spheres). We cap it here rather than asking the fork to
  # hold back `image` for our floor; drop this once Phi raises its Flutter floor
  # to 3.44+.
  image: '>=4.5.4 <4.9.0'

flutter:
  uses-material-design: true
