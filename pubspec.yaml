name: phi
description: "Phi — flexible workstation for live electronic music performance"
publish_to: 'none'
version: 0.1.0+1

# Floors = the pinned Flutter master revision in `.fvmrc` (#478): the CI pin,
# these floors and `pubspec.lock`'s `sdks:` block are one contract, bumped
# together (see the header of .github/workflows/ci.yaml).
environment:
  sdk: ^3.15.0-101.0.dev
  flutter: ">=3.50.0-1.0.pre-376"

dependencies:
  flutter:
    sdk: flutter
  # dart-yse (libYSE 3.1.0). Its native-assets build hook downloads and
  # bundles libyse.dll; YSE_DLL_PATH still overrides it for a local engine.
  yse: ^0.2.0
  google_fonts: ^6.2.1
  vector_math: ^2.1.4
  # Cross-platform path joining for the `.phi` project folder (#121):
  # RealProjectStore maps registry addresses to on-disk paths and back.
  path: ^1.9.0
  re_editor: ^0.9.0
  re_highlight: ^0.0.3
  # SMF import/export (#30): drag a `.mid` onto the MIDI surface
  # (desktop_drop) and open/save native file dialogs (file_selector, a
  # first-party Flutter plugin). The byte↔clip codec is pure Dart in
  # lib/domain/midi/smf/; these packages only own the file-IO shell.
  desktop_drop: ^0.7.1
  file_selector: ^1.1.0
  # Native allocation for the per-thread CPU sampler's Win32 calls (#24,
  # lib/platform/thread_cpu/kernel32_thread_api.dart). Already in the graph
  # through yse; declared because Phi now imports it directly.
  ffi: ^2.2.0
  # Material widgets (#478). Flutter master deprecates the in-tree
  # `package:flutter/material.dart` in favour of this package, a copy of the
  # same library decoupled into flutter/packages. Import
  # `package:material_ui/material_ui.dart`, never the framework's material.
  material_ui: ^1.9.0
  # The 3D Scene renderer (#455): a 3D engine on Flutter GPU (Impeller), so it
  # renders through Flutter's own GPU API on Linux and Windows alike, with no
  # native plugin of its own. Its build hook compiles the engine shaders with
  # the SDK's impellerc. Flutter GPU is switched on per runner
  # (`linux/runner/my_application.cc`, `windows/runner/main.cpp`). Pre-1.0:
  # the caret holds it to 0.24.x, bump deliberately.
  flutter_scene: ^0.24.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Deterministic control of Timer.periodic in the MIDI player tests (#29).
  fake_async: ^1.3.1
  # Ambient clock the MIDI transport fake integrates beats from, so its
  # engine-clock model advances with `fakeAsync` time and wall time alike (#103).
  clock: ^1.1.1

flutter:
  uses-material-design: true
  # Bundled patcher tutorials (issue #489): index.json maps an object type to
  # a slug, `<slug>.phitut.json` holds the tutorial patch.
  assets:
    - assets/tutorials/patcher/
